[pytest]
# La suite quedó sin warnings el 2026-08-12 (se corrigieron los 38 de Pydantic v2
# en código propio en vez de silenciarlos). Ese baseline limpio es útil: cualquier
# warning nuevo salta a la vista.
#
# La única excepción es de reportlab, que en el import de app/features/reports/
# reporte/services.py hace hasattr(ast,'NameConstant') en su propio módulo. Es
# código de terceros: no se puede arreglar desde acá, y el filtro está acotado al
# mensaje y al módulo exactos para que no tape ningún otro DeprecationWarning.
#
# Ojo: ese import vive en un try/except Exception, así que un
# `python -W error::DeprecationWarning -c "import ...reporte.router"` NO lo delata
# — la excepción queda tragada y reportlab se degrada a None en silencio.
filterwarnings =
    ignore:ast.NameConstant is deprecated:DeprecationWarning:reportlab.lib.rl_safe_eval
